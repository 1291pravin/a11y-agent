<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A11y Agent</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230b7285'/></svg>">
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand"><span class="logo"></span>A11y Agent <span id="mode-badge" class="chip idle"></span></div>
      <nav id="nav">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/sites" data-view="sites">Sites</a>
        <a href="#/tasks" data-view="tasks">Tasks</a>
        <a href="#/prs" data-view="prs">Pull requests</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
      <div class="side-foot">
        <button id="demo-reset" class="btn ghost small">Reset demo data</button>
      </div>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
