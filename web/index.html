<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A11y Agent · Colgate-Palmolive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230068FF'/><path d='M3 8.5c2.2 2.7 7.8 2.7 10 0' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand">
        <img class="brand-logo" src="/assets/colgate-palmolive-logo.svg" alt="Colgate-Palmolive — Make More Smiles">
        <div class="product-name">
          <span>A11y Agent</span>
          <span id="mode-badge" class="chip idle" hidden></span>
        </div>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/sites" data-view="sites">Sites</a>
        <a href="#/tasks" data-view="tasks">Tasks</a>
        <a href="#/prs" data-view="prs">Pull requests</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
      <div class="side-foot">
        <span class="side-purpose">Reimagining a healthier, more accessible future.</span>
        <button id="demo-reset" class="btn ghost small">Reset demo data</button>
      </div>
    </aside>
    <main id="main" aria-busy="true"></main>
  </div>

  <!--
    Live regions and overlays live OUTSIDE #main on purpose: app.js replaces
    #main wholesale on every poll, which would destroy them (and, when #main
    itself carried aria-live, re-announce the entire page every 3 seconds).
  -->
  <div id="announcer" role="status" aria-live="polite" class="sr-only"></div>
  <div id="toasts" class="toasts"></div>
  <div id="conn-banner" class="conn-banner" role="status" hidden></div>

  <div id="token-dialog" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="token-title">
      <h2 id="token-title">Admin token required</h2>
      <p>This server runs with <code>ADMIN_TOKEN</code> set, so write actions need a bearer token. It is stored in this browser only.</p>
      <div class="field">
        <label for="token-input">Admin token</label>
        <input id="token-input" type="password" autocomplete="off" spellcheck="false">
      </div>
      <div class="err" id="token-err" role="alert"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="token-cancel" type="button">Cancel</button>
        <button class="btn" id="token-save" type="button">Save &amp; retry</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
