<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A11y Agent · Colgate-Palmolive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230068FF'/><path d='M3 8.5c2.2 2.7 7.8 2.7 10 0' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand">
        <img class="brand-logo" src="/assets/colgate-palmolive-logo.svg" alt="Colgate-Palmolive — Make More Smiles">
        <div class="product-name">
          <span>A11y Agent</span>
          <span id="mode-badge" class="chip idle"></span>
        </div>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/sites" data-view="sites">Sites</a>
        <a href="#/tasks" data-view="tasks">Tasks</a>
        <a href="#/prs" data-view="prs">Pull requests</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
      <div class="side-foot">
        <span class="side-purpose">Reimagining a healthier, more accessible future.</span>
        <button id="demo-reset" class="btn ghost small">Reset demo data</button>
      </div>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
